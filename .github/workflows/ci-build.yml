name: CI-build

on: [push, pull_request]

jobs:
  linux:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        uses: ./.github/actions/configure-linux
        with:
          configure_options: --with-catch2
          
      - name: Build
        run: make -j $(nproc)
        
      - name: Install
        run: sudo make install
        
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          test_application_path: /usr/local/bin/alephone_tests
          
  linux-standalone-hub:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        uses: ./.github/actions/configure-linux
        with:
          configure_options: --enable-standalone-hub --disable-opengl
          
      - name: Build
        run: make -j $(nproc)
        
      - name: Install
        run: sudo make install
        
  linux-without-opengl:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        uses: ./.github/actions/configure-linux
        with:
          configure_options: --disable-opengl --with-catch2
          
      - name: Build
        run: make -j $(nproc)
        
      - name: Install
        run: sudo make install
        
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          test_application_path: /usr/local/bin/alephone_tests
        
  mac-osx-x64:
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build-mac-osx
        with:
          xcode_arch: x86_64
          xcode_targets: "Aleph One"
          
  mac-osx-arm:
    if: ${{ false }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build-mac-osx
        with:
          xcode_arch: arm64
          xcode_targets: "Aleph One"
          
  windows-x64:
    if: ${{ false }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build-windows
        with:
          platform: x64
          configurations: Release
          vcpkg_installed_folder: installed-x64-windows
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          test_application_path: VisualStudio/x64/Release/Tests.exe
          
  windows-x86:
    if: ${{ false }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build-windows
        with:
          platform: x86
          configurations: Release
          vcpkg_installed_folder: installed-x86-windows
      - name: Run Tests
        uses: ./.github/actions/run-tests
        with:
          test_application_path: VisualStudio/Release/Tests.exe

  switch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        uses: ./.github/actions/build-switch
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: alephone-switch-nro
          if-no-files-found: error
          path: out/switch/alephone.nro